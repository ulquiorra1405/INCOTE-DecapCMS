<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  <title>Panel de Administración — INCOTE</title>
</head>
<body>
  <!-- Incluir el widget de Netlify Identity ANTES que Decap CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Inicializar el widget inmediatamente para atrapar tokens de invitación
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init();
    }

    // Cuando el usuario se autentica, cerrar el modal del widget (el CMS maneja el resto)
    window.addEventListener('load', function() {
      // Si llegamos con un hash (invite token), el widget ya lo detectó
      // después de confirmar, recargamos para que Decap CMS tome control
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('login', function() {
          document.location.reload();
        });
      }
    });
  </script>
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
</body>
</html>
